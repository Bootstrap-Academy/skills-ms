  - Eingabe, Verarbeitung, Ausgabe und die Aufgaben der Hardware unterscheiden
  - Bits, Texte und Pixelbilder an eigenen Beispielen verstehen
  - Dateien speichern, wiederfinden und aus einer Sicherung wiederherstellen
  - Programme, Arbeitsspeicher und Zugriffsrechte auseinanderhalten
  - Eindeutige Abläufe mit Bedingungen und Wiederholungen bauen
  - Netzwerk, Internet und den Aufruf einer Website nachvollziehen
