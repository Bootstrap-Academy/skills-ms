translations:
  en:
    title: "IT foundations: understand computers"
    description: Build a small digital workspace step by step. Explore how computers process data, save files and run programs. Connect devices, follow the journey to a website and find out for yourself why something is not working.
    learning_goals:
      - Distinguish input, processing, output and the roles of hardware
      - Explore bits, text and pixel images using your own examples
      - Save, find and restore files from a backup
      - Distinguish programs, working memory and access permissions
      - Build precise procedures with conditions and repetition
      - Understand networks, the internet and loading a web page
      - Narrow down faults with suitable tests and verify a repair
