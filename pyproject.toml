[tool.poetry]
name = "skills-ms"
version = "2.1.2"
description = ""
authors = ["Defelo <defelo@the-morpheus.de>"]
readme = "README.md"
homepage = "https://github.com/Bootstrap-Academy/skills-ms"
repository = "https://github.com/Bootstrap-Academy/skills-ms"
packages = [{ include = "api" }]
include = ["pyproject.toml", "templates/*", "api/content/*.json"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.142.2"
uvicorn = "^0.54.0"
aiohttp = "^3.14.3"
SQLAlchemy = "^1.4.42"
aiomysql = "^0.3.2"
asyncpg = "^0.29.0"
sentry-sdk = "^2.71.0"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
httpx = "^0.28.1"
anyio = "^4.15.1"
h11 = "^0.16.0"
starlette = "^1.7.0"
alembic = "^1.13.1"
PyJWT = "^2.15.1"
PyYAML = "^6.0.1"
Jinja2 = "^3.1.6"
aiosmtplib = "^5.1.3"
email-validator = "^2.3.0"
# Patched minimums for the runtime TLS, DNS and HTTP dependency tree.
certifi = ">=2024.7.4"
dnspython = "^2.8.0"
idna = "^3.20"
urllib3 = "^2.8.0"
redis = "^5.0.4"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
isort = "^5.13.2"
black = "^26.5.1"
# WPS checks are disabled in .flake8; retain their useful standalone plugins.
flake8-commas = "^4.0.0"
flake8-quotes = "^3.3.2"
flake8-comprehensions = "^3.14.0"
flake8-docstrings = "^1.7.0"
flake8-string-format = "^0.3.0"
flake8-bugbear = "^24.4.26"
flake8-debugger = "^4.1.2"
flake8-isort = "^6.1.1"
flake8-eradicate = "^1.5.0"
flake8-bandit = "^4.1.1"
flake8-broken-line = "^1.0.0"
flake8-rst-docstrings = "^0.3.0"
pep8-naming = "^0.13.3"
darglint = "^1.8.1"
mypy = "^1.10"
SQLAlchemy = { extras = ["mypy"], version = "^1.4.42" }
pytest = "^9.1.1"
coverage = "^7.5"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.14.0"
aiosqlite = "^0.20.0"
rich = "^13.7.1"
types-PyYAML = "^6.0.12"
ruff = "^0.4.2"
# Patched minimums for the linting and development dependency tree.
GitPython = "^3.2.0"
setuptools = "^84.0.0"

[tool.poetry.scripts]
api = "api.main:main"
sweep-deleted-users = "api.sweep:main"
register-lesson-module = "api.register_lesson_module:main"
alembic = "alembic.config:main"

[tool.poe.tasks]
api = { script = "api.main:main", envfile = ".env" }
sweep-deleted-users = { script = "api.sweep:main", envfile = ".env" }
flake8 = "flake8 . --count --statistics --show-source"
isort = "isort ."
black = "black ."
format = ["isort", "black"]
mypy = "mypy ."
ruff = "ruff . --line-length 120"
lint = ["format", "ruff", "mypy", "flake8"]
test = "pytest -v tests"
pre-commit = ["lint", "coverage"]
alembic = { cmd = "alembic", envfile = ".env" }
migrate = { cmd = "alembic upgrade head", envfile = ".env" }
env = { cmd = """python -c 'from api.settings import settings; from rich import print; print(settings)'""", envfile = ".env" }
jwt = { cmd = """python -c 'from api.utils import jwt; import sys, json; print(jwt.encode_jwt(json.loads(sys.argv[1]), jwt.timedelta(seconds=int(sys.argv[2]))))'""", envfile = ".env" }
check = { cmd = """python -c 'from api.services import courses; from scripts import sync_skills; from pathlib import Path; from rich import print; print(courses.COURSES); sync_skills.main(Path("config/skills"), _list=True)'""", envfile = ".env" }
sync_skills = "python scripts/sync_skills.py"

[tool.poe.tasks.coverage]
shell = """
set -e
coverage run -m pytest -v tests
if [[ "$check" != True ]]; then fail="--fail-under=0"; fi
if ! coverage report $fail; then c=2; fi
if [[ "$xml" = True ]]; then coverage xml --fail-under=0; fi
if [[ "$html" = True ]]; then coverage html --fail-under=0 && xdg-open htmlcov/index.html; fi
if [[ "$clean" = True ]]; then coverage erase; fi
exit $c
"""
interpreter = "bash"

[tool.poe.tasks.coverage.args.xml]
options = ["--xml"]
type = "boolean"

[tool.poe.tasks.coverage.args.html]
options = ["--html"]
type = "boolean"

[tool.poe.tasks.coverage.args.clean]
options = ["--no-clean"]
type = "boolean"
default = true

[tool.poe.tasks.coverage.args.check]
options = ["--no-check"]
type = "boolean"
default = true

[tool.poe.tasks.setup]
shell = """
set -ex
poetry install --sync
if ! [[ -e .env ]]; then cp dev.env .env; fi
"""
interpreter = "bash"

[tool.black]
target-version = ["py311"]
line-length = 120
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
py_version = 311
line_length = 120
lines_after_imports = -1
reverse_relative = true
known_local_folder = ["api", "tests"]
sections = ["FUTURE", "STDLIB", "FIRSTPARTY", "THIRDPARTY", "LOCALFOLDER"]

[tool.mypy]
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ['^alembic/env\.py$', '^scripts/.+\.py$']

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = []

[tool.coverage.run]
branch = true
source = ["api"]
omit = ["api/__main__.py", "tests/*"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if settings.debug:"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
